server:
  port: 8082
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    max-connections: 10000

spring:
  application:
    name: forum-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cc91_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 500
      minimum-idle: 100
      connection-timeout: 30000
  jpa:
    hibernate:
      # ddl-auto=validate：schema 完全由 Flyway 接管，避免 Hibernate 与 Flyway 同时改表造成漂移。
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 现有数据库已由 ddl-auto=update 或 content-service 的 V1 建表，
    # 这里把 baseline 设为 2，让 Flyway 跳过 V1/V2（不存在也无妨），
    # 只执行后续版本（V3 添加复合索引）。
    baseline-on-migrate: true
    baseline-version: 2
    validate-on-migrate: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  allowed-methods: ${CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      userService:
        baseConfig: default
      notificationService:
        baseConfig: default
  ratelimiter:
    configs:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
    instances:
      userService:
        baseConfig: default
      notificationService:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      userService:
        baseConfig: default
      notificationService:
        baseConfig: default

internal:
  token: ${INTERNAL_TOKEN}
